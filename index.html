<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>artovia</title>
    <link rel="icon" type="image/png" href="./public/img/icon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./public/css/glass.css">
    <link rel="stylesheet" href="./public/css/main.css">
    <link rel="stylesheet" href="./public/css/footer.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand" style="background-color: #111112;">
            <div class="container-fluid">
                <a class="navbar-brand ms-3" href="#"><img src="./public/img/logo.svg" alt=""
                        style="filter:invert(1);height:2rem"></a>
                <div class="navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav justify-content-center w-100 gap-md-4">
                        <a class="nav-link active text-light fw-bold fs-fluid-xs" aria-current="page" href="#">HOME</a>
                        <a class="nav-link text-light fw-bold fs-fluid-xs" href="#">COMMISSIONS</a>
                        <a class="nav-link text-light fw-bold fs-fluid-xs" href="#">ARTISTS</a>

                    </div>
                    <a class="btn btn-primary glass-card fs-fluid-xs" href="">Log in/ Sign up</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-4">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="card border-3 mx-auto my-5" style="height: 640px; width: 750px; border-color: gold;">
                        <div class="col-12">
                            <h3 class="p-3 mt-2">CREATE COMMISSIONS</h3>
                        </div>

                        <div class="col-12">
                            <label class="p-3 mb-0 pb-0" style="margin-left: 75px; font-weight: 450">COMMISSION
                                NAME</label>
                            <input class="theme-fill w-75 mb-2" style="margin-left: 90px; height: 35px;" type="text">

                            <div class="row g-2 align-items-center">
                                <div class="col-auto">
                                    <label class="col-form-label" style="margin-left: 398px;">Genre</label>
                                </div>
                                <div class="col-auto mb-0">
                                    <select class="form-control form-select theme-fill" style="width: 200px;"
                                        aria-label="Filter by genre">
                                        <option value="digital">Digital Art</option>
                                        <option value="traditional">Traditional</option>
                                        <option value="concept">Concept Art</option>
                                        <option value="portrait">Portrait</option>
                                    </select>
                                </div>

                                <div class="col-auto mt-0">
                                    <label class="col-form-label mb-0"
                                        style="margin-left: 90px; font-weight: 450">Description</label>
                                    <textarea style="margin-left: 90px; height: 150px; width: 558px;" type="text"
                                        placeholder="Description here...."></textarea>
                                </div>

                                <div class="col-auto">
                                    <label class="col-form-label"
                                        style="margin-left: 223px; font-weight: 450">Budget</label>
                                    <label class="col-form-label" style="margin-left: 115px; font-weight: 450">Upload
                                        (Optional)</label>
                                </div>

                                <div class="col-auto d-flex align-items-center mt-0">
                                    <input class="theme-fill mb-2"
                                        style="margin-left: 175px; height: 35px; width: 150px;" type="text"
                                        placeholder="$100,000">
                                    <button class="btn mb-2"
                                        style="margin-left: 35px; height: 35px; width: 200px; background-color: #fcd6a1; font-weight: 500;">
                                        Select Image
                                    </button>
                                </div>

                                <button type="submit" class="btn mb-2 border-black"
                                    style="width: 557px; margin-left: 92px; background-color: #f3c688; font-weight: 500;">POST
                                    COMMISSION</button>

                                <div class="d-flex align-items-center" style="margin-left: 90px; gap: 20px;">
                                    <div class="col-auto">
                                        <button type="button" class="btn btn-success" style="width: 268px;">Save
                                            Draft</button>
                                    </div>
                                    <div class="col-auto">
                                        <button type="button" class="btn btn-danger"
                                            style="width: 268px;">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>










    <footer class="site-footer">
        <div class="container-fluid px-5">
            <div class="row">

                <!-- Brand -->
                <div class="col-12 col-md-4 mb-4 mb-md-0">
                    <img src="./public/img/logo.svg" alt="Artovia" class="footer-logo">
                    <p class="footer-tagline">Web Development Finals Project</p>
                </div>

                <!-- Navigate -->
                <div class="col-6 col-md-3 mb-4 mb-md-0">
                    <p class="footer-heading">Navigate</p>
                    <ul class="footer-links">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">Commissions</a></li>
                        <li><a href="#">Artists</a></li>
                    </ul>
                </div>

                <!-- Developers -->
                <div class="col-6 col-md-5">
                    <p class="footer-heading">Developers</p>
                    <ul class="footer-devs">
                        <li>
                            <a href="https://github.com/mizushino1" target="_blank" rel="noopener noreferrer"
                                class="footer-link developer-tag">@mizushino1</a>
                        </li>
                        <li>
                            <a href="https://github.com/gregoryy-web" target="_blank" rel="noopener noreferrer"
                                class="footer-link developer-tag">@gregoryy-web</a>
                        </li>
                        <li>
                            <a href="https://github.com/Byokuu" target="_blank" rel="noopener noreferrer"
                                class="footer-link developer-tag">@Byokuu</a>
                        </li>
                        <li>
                            <a href="https://github.com/Draven89" target="_blank" rel="noopener noreferrer"
                                class="footer-link developer-tag">@Draven89</a>
                        </li>
                        <li>
                            <a href="https://github.com/ashlea1430" target="_blank" rel="noopener noreferrer"
                                class="footer-link developer-tag">@ashlea1430</a>
                        </li>
                        <li>
                            <a href="https://github.com/jrumandap" target="_blank" rel="noopener noreferrer"
                                class="footer-link developer-tag">@jrumandap</a>
                        </li>
                    </ul>
                </div>

            </div>

            <!-- Bottom bar -->
            <div class="footer-bottom">
                <p>© 2026 Artovia · Built for Web Development course</p>
            </div>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
